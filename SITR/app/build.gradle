plugins {
    id 'com.android.application'
}
android {
    namespace 'com.sitr.guard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sitr.guard'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
